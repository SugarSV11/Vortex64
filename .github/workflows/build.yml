name: Build (Linux)

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libsdl2-dev qt6-base-dev libqt6dbus6 libgl-dev libx11-dev \
            libpipewire-0.3-dev libasound2-dev libfreetype-dev libpng-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPJ64_GLIDEN64=OFF
      - name: Build
        run: cmake --build build
