name: Release (AppImage)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  appimage:
    # ubuntu-22.04 = glibc 2.35: el AppImage resultante corre en cualquier distro igual o más nueva
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.*'
          cache: true
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config curl file \
            libsdl2-dev libgl-dev libx11-dev libpipewire-0.3-dev libasound2-dev \
            libfreetype-dev libpng-dev libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxkbcommon-x11-0 libfuse2
      - name: SDL2 reciente (el de ubuntu-22.04 es 2.0.20 y el código usa ganchos más nuevos)
        run: |
          sudo apt-get install -y libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev \
            libxkbcommon-dev libpulse-dev libudev-dev libdbus-1-dev
          curl -fsSL https://github.com/libsdl-org/SDL/releases/download/release-2.32.8/SDL2-2.32.8.tar.gz | tar xz
          cmake -S SDL2-2.32.8 -B sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/home/runner/sdl2 -DSDL_STATIC=OFF -DSDL_TESTS=OFF
          cmake --build sdl-build && cmake --install sdl-build
      - name: Construir AppImage
        run: packaging/linux/build-appimage.sh
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          PKG_CONFIG_PATH: /home/runner/sdl2/lib/pkgconfig
          LD_LIBRARY_PATH: /home/runner/sdl2/lib
      - name: Nombre con versión
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv Vortex64-x86_64.AppImage "Vortex64-${GITHUB_REF_NAME#v}-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: Vortex64-AppImage
          path: Vortex64*-x86_64.AppImage
      - name: Publicar en la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Vortex64-*-x86_64.AppImage
